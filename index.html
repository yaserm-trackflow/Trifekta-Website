<style>
  /* --- HERO LAYOUT & SPLIT --- */
  .hero {
    padding: 160px 0 120px;
    position: relative;
    overflow-x: hidden; /* Essential for the 'bleed' effect */
    background: var(--bg);
  }

  .hero .container {
    max-width: 1300px; /* Slightly wider to accommodate the split */
    margin: 0 auto;
    padding: 0 24px;
  }

  .hero-split {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
  }

  .hero-inner {
    flex: 0 0 55%; /* Text takes up 55% */
    max-width: 620px;
    position: relative;
    z-index: 10;
  }

  /* --- TRACKFLOW MOCKUP (THE PEEK-IN) --- */
  .hero-mockup {
    flex: 0 0 45%;
    position: relative;
    display: flex;
    justify-content: flex-end;
    perspective: 2000px; /* Creates the 3D depth */
  }

  .mockup-container {
    width: 850px; /* Large width to bleed off the screen */
    height: 540px;
    background: var(--bg-subtle);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    display: flex;
    overflow: hidden;
    transform: rotateY(-15deg) rotateX(5deg) translateX(50px);
    transform-origin: left center;
    transition: transform 0.5s ease;
  }

  .mockup-container:hover {
    transform: rotateY(-10deg) rotateX(2deg) translateX(30px);
  }

  /* Internal Mockup UI (TrackFlow Replica) */
  .mock-sidebar {
    width: 70px;
    background: #2d3748; /* Your Navy */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
    gap: 15px;
  }
  .mock-side-item { width: 30px; height: 30px; background: rgba(255,255,255,0.1); border-radius: 6px; }
  .mock-side-item.active { background: var(--orange); }

  .mock-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #f7f7f5;
  }

  .mock-header {
    height: 60px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
  }
  .mock-search { width: 200px; height: 30px; background: #eee; border-radius: 4px; }
  .mock-user { width: 32px; height: 32px; background: #ddd; border-radius: 50%; }

  .mock-body { padding: 25px; display: flex; flex-direction: column; gap: 20px; }
  .mock-stats { display: flex; gap: 15px; }
  .mock-stat-card { flex: 1; height: 80px; background: #fff; border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--orange); }
  
  .mock-table { flex: 1; background: #fff; border-radius: 8px; border: 1px solid var(--border); padding: 15px; }
  .mock-row { height: 12px; background: #f0f0f0; margin-bottom: 10px; border-radius: 2px; width: 100%; }
  .mock-row.short { width: 60%; }

  /* --- RESPONSIVENESS --- */
  @media (max-width: 1100px) {
    .hero-split { flex-direction: column; text-align: center; }
    .hero-inner { flex: 0 0 100%; max-width: 100%; }
    .hero-mockup { width: 100%; justify-content: center; margin-top: 60px; }
    .mockup-container { width: 100%; transform: none; height: 400px; }
  }
</style>

<section class="hero" id="hero">
  <div class="container">
    <div class="hero-split">
      
      <div class="hero-inner">
        <div class="hero-eyebrow">
          <div class="hero-eyebrow-dot"></div>
          <span class="label">Trifekta Platform</span>
        </div>
        <h1 class="hero-headline">
          Operations.<br><em>Made Visible.</em>
        </h1>
        <p class="hero-sub">
          Trifekta is building the operating system for furniture fabricators and studios —
          giving every team the clarity, control, and consistency to run better operations.
        </p>
        
        <div class="pillars-wrap">
          <div class="pillars-label">Built on three pillars</div>
          <div class="pillars">
            <div class="pillar active">Execution</div>
            <div class="pillar">Operations</div>
            <div class="pillar">Insight</div>
          </div>
        </div>
      </div>

      <div class="hero-mockup">
        <div class="mockup-container">
          <div class="mock-sidebar">
            <div class="mock-side-item active"></div>
            <div class="mock-side-item"></div>
            <div class="mock-side-item"></div>
            <div class="mock-side-item"></div>
          </div>
          <div class="mock-main">
            <div class="mock-header">
              <div class="mock-search"></div>
              <div class="mock-user"></div>
            </div>
            <div class="mock-body">
              <div class="mock-stats">
                <div class="mock-stat-card"></div>
                <div class="mock-stat-card"></div>
                <div class="mock-stat-card"></div>
              </div>
              <div class="mock-table">
                <div class="mock-row"></div>
                <div class="mock-row short"></div>
                <div class="mock-row"></div>
                <div class="mock-row short"></div>
                <div class="mock-row"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
